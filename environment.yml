# Reproducible environment. Versions pinned to what is installed in `hrh`
# (checked 2026-11-24). Recreate with:  conda env create -f environment.yml
name: hrh
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas=3.1.1
  - numpy=2.5.4
  - scipy=1.18.1
  - xarray=2026.9.0
  - geopandas=1.2.0
  - shapely=2.2.0
  - pyogrio=0.13.0
  - mapclassify=2.11.0
  - scikit-learn=1.9.1
  - statsmodels=0.15.0
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - netcdf4=1.7.4
  - lxml=6.1.3
  - pyarrow=26.0.1
  - openpyxl=3.1.5
  - requests=2.34.2
  - jupyter
  - nbformat=5.11.1
  - nbconvert=7.17.2
  - pip
  - pip:
      - imdlib==0.4.0
      - streamlit==1.67.0
      - plotly==7.1.0
      - pytest==8.3.4
